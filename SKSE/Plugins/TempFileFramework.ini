; Temp File Framework - settings
; https://github.com/HDharder/Skyrim-Temp-File-Framework
;
; ------------------------------------------------------------------------------------------------
; Session-only paths (OFF by default: nothing is listed below)
; ------------------------------------------------------------------------------------------------
; Every file written to a path listed here becomes a session-only temp file: the write never
; reaches Data or Mod Organizer 2's overwrite folder, and it is gone when the game closes (normal
; exit, CTD or "End task"). Reading is not affected, and files that already exist keep their
; original content on disk - changes only live for the session.
;
; One path per line, relative to Data. '/' or '\' both work, case does not matter.
;   *  matches anything, including subfolders      ?  matches one character
;
; ONLY list files that are safe to lose every time the game closes: caches, logs, data a mod
; rebuilds at startup. Do NOT list settings or saves (MCM settings, PapyrusUtil/JContainers data,
; RaceMenu presets...) - they would be wiped every session.
;
; Mods and modlists can also add their own list without touching this file: any .ini inside
; Data\SKSE\Plugins\TempFileFramework\SessionOnly\ with a [SessionOnly] section is read too.
;
; Examples (remove the ';' to enable):
[SessionOnly]
;SKSE/Plugins/SomeMod/cache/*
;SKSE/Plugins/*.log
